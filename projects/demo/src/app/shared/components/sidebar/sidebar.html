<aside class="sidebar" aria-label="Sidebar navigation">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    <input
      id="sidebar-search"
      name="search"
      type="search"
      placeholder="Search..."
      aria-label="Search"
    />
    <kbd class="hotkey">/</kbd>
  </div>

  <nav class="nav-groups">
    @for (section of sections(); track section.title) {
      <div class="nav-section">
        <div class="section-title">{{ section.title }}</div>

        @if (section.branch) {
          <button type="button" class="branch-selector">
            <svg class="branch-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="6" r="2.5" />
              <circle cx="18" cy="8" r="2.5" />
              <circle cx="18" cy="17" r="2.5" />
              <path d="M8.5 6H12v11h3.5M12 8h3.5" />
            </svg>
            <span class="branch-label">{{ section.branch }}</span>
            <svg class="chevron-duo" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 15 4 4 4-4M8 9l4-4 4 4" />
            </svg>
          </button>
        }

        @for (item of section.items; track item.id) {
          @if (item.route) {
            <a
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h16M8 16v-5M12 16V8M16 16v-3" />
              </svg>
              {{ item.label }}
            </a>
          } @else {
            <a class="nav-item" aria-disabled="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                @switch (item.icon) {
                  @case ('home') {
                    <path d="m3 9.5 9-7 9 7V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" />
                    <path d="M9 16h6" />
                  }
                  @case ('environments') {
                    <circle cx="6" cy="6" r="2.5" />
                    <circle cx="18" cy="8" r="2.5" />
                    <circle cx="18" cy="17" r="2.5" />
                    <path d="M8.5 6H12v11h3.5M12 8h3.5" />
                  }
                  @case ('integrations') {
                    <path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18" />
                  }
                  @case ('settings') {
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                    />
                  }
                  @case ('grid') {
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <path d="M4 10h16M10 4v16" />
                  }
                  @case ('star') {
                    <polygon
                      points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                    />
                  }
                  @case ('cube') {
                    <path
                      d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
                    />
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                    <line x1="12" y1="22.08" x2="12" y2="12" />
                  }
                  @case ('history') {
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5M12 7v5l4 2" />
                  }
                  @case ('mask') {
                    <path d="M20 8v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8M2 4h20v4H2zM10 13h4" />
                  }
                  @case ('api') {
                    <ellipse cx="12" cy="7" rx="8" ry="3.5" />
                    <path d="M4 7v4c0 1.9 3.6 3.5 8 3.5s8-1.6 8-3.5V7M12 14.5V19M8 19h8" />
                  }
                  @case ('key') {
                    <circle cx="8" cy="15" r="4" />
                    <path d="m10.85 12.15 7.65-7.65M15.5 7.5l2 2M18.5 4.5l2 2" />
                  }
                }
              </svg>
              {{ item.label }}
            </a>
          }
        }
      </div>
    }
  </nav>

  <div class="banner-box">
    <div class="star-badge">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
        />
      </svg>
    </div>
    <span class="banner-label">Scale your infrastructure</span>
  </div>
</aside>
