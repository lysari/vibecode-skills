<aside class="docs-sidebar" aria-label="Components directory">
  <!-- Top Search Box matching sidebar template -->
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.2754 2.71423C16.003 2.71423 19.8364 6.54661 19.8364 11.2752C19.8364 16.0038 16.003 19.8361 11.2754 19.8361C6.54686 19.8361 2.71448 16.0038 2.71448 11.2752C2.71448 6.54661 6.54686 2.71423 11.2754 2.71423Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M19.899 18.4875C20.678 18.4875 21.3095 19.1199 21.3095 19.898C21.3095 20.678 20.678 21.3095 19.899 21.3095C19.1199 21.3095 18.4875 20.678 18.4875 19.898C18.4875 19.1199 19.1199 18.4875 19.899 18.4875Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <input
      type="search"
      placeholder="Filter components..."
      aria-label="Filter components"
      [value]="searchQuery()"
      (input)="onSearch($event)"
    />
    @if (searchQuery()) {
      <button
        type="button"
        class="clear-btn"
        (click)="clearSearch()"
        aria-label="Clear filter"
      >
        ×
      </button>
    }
  </div>


  <!-- Groups List -->
  <nav class="nav-groups" aria-label="Component directory">
    @for (group of filteredGroups(); track group.title) {
      <div class="nav-section">
        <div class="section-head">
          <span class="section-title">{{ group.title }}</span>
          <span class="section-count">{{ group.links.length }}</span>
        </div>

        @for (link of group.links; track link.path) {
          <a
            class="nav-item"
            liquidPress
            routerLinkActive="is-active"
            [routerLink]="link.path"
          >
            <span class="item-mark" aria-hidden="true"></span>
            <span class="item-info">
              <span class="item-title">{{ link.title }}</span>
              <span class="item-caption">{{ link.caption }}</span>
            </span>
          </a>
        }
      </div>
    } @empty {
      <div class="empty-state">
        <p>No components match "{{ searchQuery() }}"</p>
        <button type="button" class="reset-btn" (click)="clearSearch()">Reset</button>
      </div>
    }
  </nav>

  <!-- Bottom Badge matching app-sidebar -->
  <div class="banner-box">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm-.75 6.75a.75.75 0 011.5 0v4.5a.75.75 0 01-1.5 0V9zm.75 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" fill="currentColor"/>
      </svg>
    </div>
    <span class="banner-label">{{ totalCount }} Design Components</span>
  </div>
</aside>
