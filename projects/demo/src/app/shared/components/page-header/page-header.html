<header class="header">
  <div class="header-top">
    <div class="header-titles">
      <h1 class="title">{{ config().title }}</h1>
      <p class="subtitle">{{ config().subtitle }}</p>
    </div>

    <div class="header-controls">
      <x-liquid-tabs
        [value]="activeRange()"
        (valueChange)="activeRange.set($event ?? '24h')"
        aria-label="Time range"
        style="--liquid-tabs-padding: 3px; --liquid-tabs-tab-padding: 5px 12px; --liquid-tabs-radius: var(--pill-radius);"
      >
        @for (range of config().ranges; track range) {
          <button type="button" [liquidTab]="range">{{ range }}</button>
        }
      </x-liquid-tabs>

      <button type="button" liquidButton variant="tinted" class="refresh-btn" (click)="onRefresh()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.979 4.60132V17.2193" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.8999 8.69998C2.8999 8.69998 5.0689 4.59998 6.9779 4.59998C8.8859 4.59998 11.0559 8.69998 11.0559 8.69998" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16.9058 19.4274V6.80945" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.9849 15.3284C20.9849 15.3284 18.8149 19.4284 16.9069 19.4284C14.9989 19.4284 12.8289 15.3284 12.8289 15.3284" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="compute-row">
    <div class="compute-left">
      <span class="compute-label">Compute</span>
      <div class="compute-pill">
        <span class="pill-name">{{ config().computeName }}</span>
        <span class="status-pill">
          <span class="status-indicator" aria-label="Status: online"></span>
          <span class="status-text">{{ config().computeStatus }}</span>
        </span>
      </div>
    </div>

    <div class="endpoint-meta">
      @for (meta of config().endpointMeta; track meta) {
        <span class="meta-chip">{{ meta }}</span>
      }
    </div>
  </div>
</header>
