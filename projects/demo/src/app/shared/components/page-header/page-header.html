<header class="header">
  <div class="header-top">
    <div class="header-titles">
      <h1 class="title">{{ config().title }}</h1>
      <p class="subtitle">{{ config().subtitle }}</p>
    </div>

    <div class="header-controls">
      <div class="range-pill" role="group" aria-label="Time range">
        @for (range of config().ranges; track range) {
          <button
            type="button"
            class="range-btn"
            [class.is-active]="range === config().activeRange"
          >
            {{ range }}
          </button>
        }
      </div>
      <button type="button" class="refresh-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="compute-row">
    <div class="compute-left">
      <span class="compute-label">Compute</span>
      <div class="compute-pill">
        <span class="pill-name">{{ config().computeName }}</span>
        <span class="status-pill">
          <span class="status-indicator" aria-label="Status: online"></span>
          <span class="status-text">{{ config().computeStatus }}</span>
        </span>
      </div>
    </div>

    <div class="endpoint-meta">
      @for (meta of config().endpointMeta; track meta) {
        <span class="meta-chip">{{ meta }}</span>
      }
    </div>
  </div>
</header>
