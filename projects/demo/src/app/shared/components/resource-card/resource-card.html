<div class="card resource-card">
  <div class="card-head">
    <div>
      <h2 class="card-title">{{ config().title }}</h2>
      <div class="card-metric">{{ config().subtitle }}</div>
    </div>
    <span class="card-badge">{{ currentBadge() }}</span>
  </div>

  <div class="resource-items">
    @for (item of items(); track item.id) {
      <div class="resource-item">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            @switch (item.icon) {
              @case ('capacity') {
                <path d="M7.4831 10.261V16.9547" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12.0369 7.05737V16.9553" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16.5157 13.7982V16.9551" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M2.30005 12.0369C2.30005 4.73479 4.73479 2.30005 12.0369 2.30005C19.339 2.30005 21.7737 4.73479 21.7737 12.0369C21.7737 19.339 19.339 21.7737 12.0369 21.7737C4.73479 21.7737 2.30005 19.339 2.30005 12.0369Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              }
              @case ('limit') {
                <path fill-rule="evenodd" clip-rule="evenodd" d="M2.74976 12.0001C2.74976 5.06312 5.06276 2.75012 11.9998 2.75012C18.9368 2.75012 21.2498 5.06312 21.2498 12.0001C21.2498 18.9371 18.9368 21.2501 11.9998 21.2501C5.06276 21.2501 2.74976 18.9371 2.74976 12.0001Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11.9998 8.10498V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11.9955 15.5H12.0045" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              }
              @case ('timeout') {
                <path fill-rule="evenodd" clip-rule="evenodd" d="M21.2498 12.0001C21.2498 17.1081 17.1088 21.2501 11.9998 21.2501C6.89176 21.2501 2.74976 17.1081 2.74976 12.0001C2.74976 6.89112 6.89176 2.75012 11.9998 2.75012C17.1088 2.75012 21.2498 6.89112 21.2498 12.0001Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16.1906 12.7672L11.6606 12.6932V7.84619" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              }
            }
          </svg>
        </div>
        <div class="item-details">
          <div class="item-name">{{ item.title }}</div>
          <div class="item-desc">{{ item.subtitle }}</div>
        </div>
        <span class="item-value">{{ item.value }}</span>
      </div>
    }
  </div>

  <div class="status-area">
    <div class="status-row">
      <span class="status-heading">Status</span>
      <span class="status-value">{{ currentStatus() }}</span>
    </div>
    <button
      type="button"
      class="manage-button"
      liquidPress
      [liquidMenuTriggerFor]="manageMenu"
      aria-label="Manage autoscaling settings"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13.3352 19.5078H19.7122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M16.0578 4.85889V4.85889C14.7138 3.85089 12.8078 4.12289 11.7998 5.46589C11.7998 5.46589 6.78679 12.1439 5.04779 14.4609C3.30879 16.7789 4.95379 19.6509 4.95379 19.6509C4.95379 19.6509 8.19779 20.3969 9.91179 18.1119C11.6268 15.8279 16.6638 9.11689 16.6638 9.11689C17.6718 7.77389 17.4008 5.86689 16.0578 4.85889Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.5042 7.21143L15.3682 10.8624" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Manage...
    </button>

    <x-liquid-menu-popup #manageMenu="liquidMenu" role="dialog" title="Compute & Autoscaling">
      <ng-template liquidMenuContent>
        <div class="manage-modal">
          <p class="manage-hint">
            Configure autoscaling boundaries and suspension timeouts.
          </p>

          <div class="manage-control">
            <x-liquid-toggle
              [value]="autoscaling()"
              (valueChange)="autoscaling.set($event)"
              label="Autoscaling active"
              hint="Dynamically adjusts compute units to match query load."
            />
          </div>

          <div class="manage-control">
            <x-liquid-slider
              [value]="scalingLimit()"
              (valueChange)="scalingLimit.set($event ?? 2.0)"
              [min]="0.5"
              [max]="8"
              [step]="0.25"
              label="Scaling Limit (CU)"
              hint="Max compute units boundary for autoscaling."
            />
          </div>

          <div class="manage-control">
            <x-liquid-slider
              [value]="idleTimeout()"
              (valueChange)="idleTimeout.set($event ?? 5)"
              [min]="1"
              [max]="30"
              [step]="1"
              label="Idle Timeout (min)"
              hint="Endpoint suspended after period of inactivity."
            />
          </div>

          <div class="manage-footer">
            <button
              type="button"
              liquidButton
              variant="filled"
              (click)="applyChanges(manageMenu)"
            >
              Apply Changes
            </button>
            <button
              type="button"
              liquidButton
              variant="plain"
              (click)="manageMenu.close()"
            >
              Cancel
            </button>
          </div>
        </div>
      </ng-template>
    </x-liquid-menu-popup>
  </div>
</div>
